name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  # The app modules read these at import time. Tests never authenticate, so
  # placeholders are fine — but they must be present.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Multi-arch PostGIS build; the official postgis/postgis has no arm64 tag.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations
        # The migrations are written to run on a vanilla PostGIS cluster as well as
        # on Supabase — Supabase-only objects sit behind DO-block guards.
        run: |
          for f in supabase/migrations/*.sql; do
            echo "--- $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Load test fixture
        # A committed slice of real TaiCOL + TaiRON data. CI must not hit the live
        # TaiCOL/GBIF APIs: one takes ~4 minutes, the other is intermittently slow.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed-test.sql

      - run: npx tsc --noEmit -p apps/web/tsconfig.json
        name: Typecheck (web)

      - run: npm run typecheck --workspace @conservation/scripts
        # The importers and the DwC exporter run under tsx, which strips types
        # without checking them. Nothing else in CI touches this code.
        name: Typecheck (scripts)

      - run: npm run lint --workspace @conservation/web
        name: Lint

      - name: Build
        # NEXT_PUBLIC_E2E exposes window.__map so the page spec can move the map
        # deterministically. It is inlined at build time, so it is present only in
        # this build and never in a deployed one.
        env:
          NEXT_PUBLIC_E2E: "1"
        run: npm run build

      - name: Start server
        run: |
          npm run start --workspace @conservation/web &
          # /api/health, not /. The root is prerendered and answers as soon as
          # the process is listening, which proves nothing about whether the app
          # can serve a page that needs the database — and every dynamic route
          # does. On 2026-09-23 the suite started 6s after the build and two
          # /stats assertions failed with "expected figures" and a matchAll on
          # undefined, because the fetch came back empty against a server that
          # was up but not yet able to answer.
          #
          # /api/health queries through asPublic(), so a 200 from it means a
          # real round-trip to Postgres has completed. Same lesson as the QA
          # harness: a check that passes against a server which is not serving
          # is worse than no check.
          npx wait-on http://localhost:3000/api/health --timeout 90000

      - name: Tests (privacy invariants, tile contract, shared logic)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline submission end to end
        # Runs against the production build, which is where the app registers the
        # service worker for real. The spec also registers /sw.js itself, because
        # components/ServiceWorker.tsx skips registration in dev unless
        # NEXT_PUBLIC_SW_IN_DEV is set — without that, `navigator.serviceWorker.ready`
        # just times out and the two offline-caching checks degrade into failures
        # that look like product bugs.
        run: npm run test:offline

      - name: Every page renders in both locales
        # Catches what HTTP-level checks cannot: next-intl renders a missing
        # message as its own key path rather than throwing, so the page still
        # returns 200 and looks healthy. That has slipped through three times.
        run: npm run test:pages

      - name: Every focusable control shows a focus ring
        # The usual cause of an invisible focus ring is someone writing
        # `outline: none` for looks. Nothing else here would catch that.
        run: npm run test:focus --workspace @conservation/web

      - name: Map renders end to end
        # MapLibre does all its work inside requestAnimationFrame, so only a real
        # browser can prove the heatmap actually paints. This check is what caught
        # Turbopack silently breaking MapLibre's Web Worker.
        run: npm run test:map

      - name: The map's chrome describes what the map is drawing
        # The legend used to read the colour switch and nothing else, so at high
        # zoom it labelled single records with a density class — "300+" on every
        # dot of a roadkill corridor — and beside the kernel density surface it
        # named per-cell counts that no feature on screen carries. Only a real
        # browser can get the camera past the aggregation handoff and read what
        # the legend then says.
        run: npm run test:mapchrome --workspace @conservation/web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-render
          path: apps/web/e2e/map-render.png
          if-no-files-found: ignore

      # ---- QA harness (W13) ------------------------------------------------
      # Appended, not woven in, so the branches adding their own steps above
      # this line merge without a conflict. Everything here needs the Chromium
      # installed further up, and everything except the self-test needs the
      # server started further up.
      #
      # axe and contrast are NOT here yet, deliberately. Both ratchet against a
      # recorded list of today's known issues, and neither list has ever been
      # recorded, because this harness was written without a server to record
      # it from. They run nightly in gallery.yml instead. The first nightly run
      # prints what is actually there; once somebody records it
      # (UPDATE_A11Y=1 / UPDATE_CONTRAST=1 and a reason per line), move the two
      # steps here — they are written to be moved, not rewritten.

      - name: The audits still find what they are for
        # Three seconds, no server, no database: it serves one fixture page with
        # a chip at 1.20:1, a 420px block and an unlabelled input, and fails if
        # the contrast, reflow or axe engines stop reporting them. Every bug
        # these audits have ever had made them report LESS, and a silent audit
        # is indistinguishable from a clean site.
        run: npm run test:selftest --workspace @conservation/web

      - name: No page scrolls sideways on a phone
        # Every route in both locales at 320 and 390. 320 is the WCAG reflow
        # width — what a 390px phone becomes when its owner turns on larger
        # text. This was live on two English pages, where a Latin binomial is
        # three times the width of the Chinese name beside it.
        run: npm run test:reflow --workspace @conservation/web

      - name: The map's load path is intact
        # Structural only, and hard: both MapLibre modulepreload hints, the
        # OpenFreeMap preconnect and style preload, no webfont on /map, every
        # tile gzipped, CLS under 0.05. The byte and millisecond budgets print
        # and do not fail until someone records them against production.
        run: npm run test:perf --workspace @conservation/web
