name: CI

# Every pull request and every push to main. A green run says:
#
#   - every migration applies to a fresh PostGIS cluster that has Supabase's
#     three API roles and the default grants Supabase gives them, so the
#     revokes that keep exact coordinates away from the REST API (0013, 0024)
#     are tested against the shape production started from, and once they
#     have run none of those grants reaches anything PUBLIC cannot
#     (supabase/ci-roles-check.sql);
#   - the unit suite skipped no more tests than ALLOWED_SKIPS below, which is
#     none, and a test that needs the server failed rather than skipped when
#     it was not there (requireServer, apps/web/test/helpers.mjs);
#   - the browser specs passed against a production build, the real report
#     form's submit among them, with axe and WCAG AA contrast on the pages a
#     reporter uses at a phone's width and the map's JavaScript within the
#     budget recorded from a build like this one;
#   - no production dependency carries a high or critical advisory.
#
# The full axe and contrast sweeps, every route at two widths, and the
# screenshot gallery run nightly in gallery.yml. docs/qa-harness.md says what
# runs where and why.
#
# Waiting for a server is a curl loop, not wait-on: curl is on every runner,
# asks with GET (the Supabase Auth stand-in does not answer HEAD), and leaves
# nothing for npx to resolve before the first request.

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  # The app modules read these at import time. Tests never authenticate, so
  # placeholders are fine — but they must be present.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
  # So the server runs a job that is called with it, and the monitoring test
  # can see a run reach job_runs. A placeholder: CI's database is throwaway.
  CRON_SECRET: ci-cron-placeholder

jobs:
  ml:
    # The classifier's response contracts and the rules that fit its
    # thresholds (apps/ml/test_contract.py). numpy only: no torch, no GPU, no
    # Modal account, so it runs in seconds and needs no secret. Its own job
    # rather than a step in `test`, so neither waits on the other.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "numpy>=1.26"
      - name: Classifier contract tests
        run: python -m unittest discover -s apps/ml -p "test_*.py" -v

  audit:
    # Known advisories in what ships: dependencies, not devDependencies, at
    # high or critical. Reads package-lock.json and asks the registry, so it
    # needs no install and no database, and runs beside the suite rather than
    # in front of it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit, production dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Multi-arch PostGIS build; the official postgis/postgis has no arm64 tag.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create Supabase's API roles
        # anon, authenticated and service_role, and the ALL that Supabase
        # grants the first two on whatever `postgres` creates in public.
        # Without them 0013 and 0024 had nothing to revoke here, and the
        # thirty tests of what the REST API's roles can reach (reports and its
        # exact points, the public views, the site's functions, every forum
        # table) skipped on every run. The file refuses any cluster but this
        # empty one, and says what it leaves out.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/ci-roles.sql

      - name: Apply migrations
        # The migrations are written to run on a vanilla PostGIS cluster as well as
        # on Supabase — Supabase-only objects sit behind DO-block guards. The
        # guards that test for a role now find one, so the blocks behind them
        # run here too; the ones that call auth.uid() also test for the auth
        # schema, which this cluster does not have.
        run: |
          for f in supabase/migrations/*.sql; do
            echo "--- $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: The migrations took back what the API roles were given
        # The roles step opened everything `postgres` creates in public to
        # anon and authenticated, and 0013 and 0024 are what close it again.
        # If either stopped doing so, or a later migration gave one of the
        # three roles a default, a table, a column or a function, this finds
        # it: a default left behind would open every table made after it to
        # the anon key, on production too. The file says the one kind of
        # grant it lets stay, and why.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/ci-roles-check.sql

      - name: Load test fixture
        # A committed slice of real TaiCOL + TaiRON data. CI must not hit the live
        # TaiCOL/GBIF APIs: one takes ~4 minutes, the other is intermittently slow.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed-test.sql

      - name: Load English names
        # What production has held since migration 0015: the committed names
        # file and the team's overrides, applied to the fixture's taxa. Reads
        # the database only; no network. Without it every English name on the
        # pages and in search is untested here.
        run: npm run import:names-en

      - run: npx tsc --noEmit -p apps/web/tsconfig.json
        name: Typecheck (web)

      - run: npm run typecheck --workspace @conservation/scripts
        # The importers and the DwC exporter run under tsx, which strips types
        # without checking them. Nothing else in CI touches this code.
        name: Typecheck (scripts)

      - run: npm run lint --workspace @conservation/web
        name: Lint

      - name: Build
        # NEXT_PUBLIC_E2E exposes window.__map so the page spec can move the map
        # deterministically. It is inlined at build time, so it is present only in
        # this build and never in a deployed one.
        env:
          NEXT_PUBLIC_E2E: "1"
        run: npm run build

      - name: Start a stand-in for Supabase Auth
        # NEXT_PUBLIC_SUPABASE_URL above points at 127.0.0.1:54321, where
        # nothing used to listen, so every test that needs Supabase Auth to
        # answer skipped here: the proxy's session renewal in the built app,
        # where /login sends someone who is already signed in (an open
        # redirect needing no click was once possible there), and what a page
        # does when Supabase stops answering. A green run said nothing about
        # any of them. The stand-in answers the few endpoints those use, the
        # way GoTrue does; apps/web/test/stub-gotrue.mjs says which. Locally
        # the same tests run against the real local Supabase stack instead.
        #
        # Up to 30 tries a second apart, quietly; then once more aloud, so a
        # stand-in that never came up fails the step with curl's own reason.
        run: |
          node apps/web/test/stub-gotrue.mjs &
          for i in $(seq 30); do curl -fs -o /dev/null --max-time 5 http://127.0.0.1:54321/auth/v1/health && break; sleep 1; done
          curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:54321/auth/v1/health

      - name: Start server
        run: |
          npm run start --workspace @conservation/web &
          # /api/health, not /. The root is prerendered and answers as soon as
          # the process is listening, which proves nothing about whether the app
          # can serve a page that needs the database — and every dynamic route
          # does. On 2026-09-23 the suite started 6s after the build and two
          # /stats assertions failed with "expected figures" and a matchAll on
          # undefined, because the fetch came back empty against a server that
          # was up but not yet able to answer.
          #
          # /api/health queries through asPublic(), so a 200 from it means a
          # real round-trip to Postgres has completed. Same lesson as the QA
          # harness: a check that passes against a server which is not serving
          # is worse than no check. -f makes anything but a 2xx a failure, so a
          # health check answering 500 is waited out like a closed port.
          for i in $(seq 90); do curl -fs -o /dev/null --max-time 5 http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS -o /dev/null --max-time 5 http://localhost:3000/api/health

      - name: Tests (privacy invariants, tile contract, shared logic)
        # A skipped test is printed beside the passes and read as one, so the
        # step fails when more tests skip than ALLOWED_SKIPS. That is none:
        # the roles above, the Auth stand-in and the fixture give every test
        # what it asks for, and one that needs the server throws here rather
        # than skipping (requireServer). Before this, 36 skipped on every run,
        # 30 of them the checks of what anon and authenticated can reach. A
        # test that has to skip in CI raises the number in the same commit,
        # with its name and its reason in docs/qa-harness.md.
        #
        # The count is read off node's own summary, in either of its formats:
        # TAP ("# skipped 2"), which node 22 prints when the output is not a
        # terminal, and spec ("ℹ skipped 2"), its default from node 23 on. No
        # summary at all fails too: then nothing says what ran.
        env:
          ALLOWED_SKIPS: "0"
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
          status=${PIPESTATUS[0]}
          set -e
          skipped=$(grep -aE '^(# |ℹ )skipped [0-9]+$' "$RUNNER_TEMP/unit-tests.log" | tail -n 1 | grep -oE '[0-9]+$' || true)
          if [ -z "$skipped" ]; then
            echo "::error::npm test printed no summary, so nothing says what ran."
            exit 1
          fi
          if [ "$skipped" -gt "$ALLOWED_SKIPS" ]; then
            grep -aE '# SKIP|^ *﹣ ' "$RUNNER_TEMP/unit-tests.log" || true
            echo "::error::$skipped tests skipped and $ALLOWED_SKIPS may. Give each what it needs here, or raise ALLOWED_SKIPS with its reason in docs/qa-harness.md."
            exit 1
          fi
          echo "$skipped skipped, $ALLOWED_SKIPS allowed."
          exit "$status"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline submission end to end
        # Runs against the production build, which is where the app registers the
        # service worker for real. The spec also registers /sw.js itself, because
        # components/ServiceWorker.tsx skips registration in dev unless
        # NEXT_PUBLIC_SW_IN_DEV is set — without that, `navigator.serviceWorker.ready`
        # just times out and the two offline-caching checks degrade into failures
        # that look like product bugs.
        run: npm run test:offline

      - name: Filing a report, and the card it leaves
        # The one spec that submits the real form: a tap on the map and the
        # submit button, on the wildlife page in both languages, then on the
        # roadkill page (with its dead-or-hurt answer) and the invasive page.
        # The browser's /api/reports is stubbed with each answer the route
        # can give, so what is checked is the card: that its words describe
        # the report just filed, that its link opens a real record (planted
        # for the run and removed after), and what the roadkill and invasive
        # pages add to it. It ran nowhere before this step.
        run: npm run test:receipt --workspace @conservation/web

      - name: Sharing a record, a species and the season goal
        # The share button with no navigator.share, as LINE's in-app browser
        # has it, and with one: the LINE link and the copied link must carry
        # the page's own address, copying must say it worked, every control
        # is 44px tall, and axe runs with the choices open, in both languages
        # at a phone's width.
        run: npm run test:share --workspace @conservation/web

      - name: Every page renders in both locales
        # Catches what HTTP-level checks cannot: next-intl renders a missing
        # message as its own key path rather than throwing, so the page still
        # returns 200 and looks healthy. That has slipped through three times.
        run: npm run test:pages

      - name: Every focusable control shows a focus ring
        # The usual cause of an invisible focus ring is someone writing
        # `outline: none` for looks. Nothing else here would catch that.
        run: npm run test:focus --workspace @conservation/web

      - name: Map renders end to end
        # MapLibre does all its work inside requestAnimationFrame, so only a real
        # browser can prove the heatmap actually paints. This check is what caught
        # Turbopack silently breaking MapLibre's Web Worker.
        run: npm run test:map

      - name: The map's chrome describes what the map is drawing
        # The legend used to read the colour switch and nothing else, so at high
        # zoom it labelled single records with a density class — "300+" on every
        # dot of a roadkill corridor — and beside the kernel density surface it
        # named per-cell counts that no feature on screen carries. Only a real
        # browser can get the camera past the aggregation handoff and read what
        # the legend then says.
        run: npm run test:mapchrome --workspace @conservation/web

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: map-render
          path: apps/web/e2e/map-render.png
          if-no-files-found: ignore

      # ---- QA harness (W13) ------------------------------------------------
      # Appended, not woven in, so the branches adding their own steps above
      # this line merge without a conflict. Everything here needs the Chromium
      # installed further up, and everything except the self-test needs the
      # server started further up.
      #
      # axe and contrast run here on the pages a reporter uses, at a phone's
      # width, and over every route at both widths nightly in gallery.yml.
      # Both ratchet against a recorded list of known issues, and both lists
      # are empty and have stayed clean every night since they were first
      # run, so any finding on these pages fails the pull request that made it.

      - name: The audits still find what they are for
        # Three seconds, no server, no database: it serves one fixture page with
        # a chip at 1.20:1, a 420px block and an unlabelled input, and fails if
        # the contrast, reflow or axe engines stop reporting them. Every bug
        # these audits have ever had made them report LESS, and a silent audit
        # is indistinguishable from a clean site.
        run: npm run test:selftest --workspace @conservation/web

      - name: No page scrolls sideways on a phone
        # Every route in both locales at 320 and 390. 320 is the WCAG reflow
        # width — what a 390px phone becomes when its owner turns on larger
        # text. This was live on two English pages, where a Latin binomial is
        # three times the width of the Chinese name beside it.
        run: npm run test:reflow --workspace @conservation/web

      - name: axe on the report pages and the map, at 390px
        # The chooser, the three report pages and /map, in both languages, at
        # the width of the phones they are filled in on: the pages a student
        # uses with one thumb at a roadside.
        env:
          ONLY: report,report-roadkill,report-invasive,report-wildlife,map
          WIDTHS: "390"
        run: npm run test:a11y --workspace @conservation/web

      - name: WCAG AA contrast on the same pages
        # The same five routes, both languages, 390px. Measured on the
        # composited page, so map chrome is read against the map's dark
        # ground and not the light page behind it.
        env:
          ONLY: report,report-roadkill,report-invasive,report-wildlife,map
          WIDTHS: "390"
        run: npm run test:contrast --workspace @conservation/web

      - name: The map's load path is intact
        # Structural and hard: both MapLibre modulepreload hints, the
        # OpenFreeMap preconnect and style preload, no webfont on /map, every
        # tile gzipped, CLS under 0.05. The JavaScript budgets in
        # e2e/perf-budget.json were recorded from a build like this one
        # (PERF_LABEL=ci) and fail at 10% over. The timings print and do not
        # fail: a runner's clock is too noisy to gate on.
        run: npm run test:perf --workspace @conservation/web

      - name: Deleting your own account
        # From /me, in a browser, as a person does it: the account, the
        # profile and every link from a report to its reporter go; the report
        # stays. The account is made on the Supabase Auth stand-in above.
        run: node apps/web/e2e/account.spec.mjs

      - name: Moderating from a phone
        # A throwaway moderator publishes one held report and rejects another
        # with a reason written on the page; the database and the log are
        # checked, not only the screen.
        run: node apps/web/e2e/moderation.spec.mjs

      # ---- Discussion forum ------------------------------------------------
      # The forum ships dark: it answers only on a server started with
      # FORUM_ENABLED=1 (apps/web/lib/forum/gate.ts). The server above runs
      # without it, exactly as production does, so everything above tests the
      # site as it ships, and these two steps test the switch both ways.

      - name: The forum is not there while it is switched off
        # Every forum page in both languages, both forum API routes and every
        # forum server action in the build manifest must answer 404, and
        # nothing public may link to /community.
        run: node apps/web/e2e/forum.spec.mjs

      - name: The forum works when it is switched on
        # A second server from the same build with the switch on. No second
        # build is needed: every forum page is rendered per request, so the
        # switch is read when a request arrives. The accounts the spec signs
        # in with are made on the Supabase Auth stand-in started above.
        env:
          FORUM_ENABLED: "1"
        run: |
          npm run start --workspace @conservation/web -- -p 3001 &
          for i in $(seq 90); do curl -fs -o /dev/null --max-time 5 http://localhost:3001/api/health && break; sleep 1; done
          curl -fsS -o /dev/null --max-time 5 http://localhost:3001/api/health
          TEST_BASE_URL=http://localhost:3001 node apps/web/e2e/forum.spec.mjs
