name: Production watch

# Asks production whether it is up, every hour, and opens an issue when it is
# not; and checks every production deploy as it lands.
#
# Nothing did either before. Vercel's Hobby plan keeps function logs for about
# an hour, so a night's outage was found whenever someone next opened the
# site, with the evidence gone. What is checked, and when an issue is opened,
# commented on or closed, is in scripts/production-watch.mjs; the policy is
# tested in apps/web/test/production-watch.test.mjs.
#
#   Run it by hand:  gh workflow run production-watch.yml

on:
  schedule:
    # Twenty-three minutes past, not on the hour, when GitHub's scheduler is
    # busiest and most likely to start a run late or not at all.
    - cron: "23 * * * *"
  workflow_dispatch:
  # Vercel reports each deployment to GitHub; a successful production one is
  # checked end to end by scripts/verify-deploy.mjs (the job at the bottom).
  deployment_status:

permissions: {}

jobs:
  watch:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, so a manual run during a scheduled one cannot open the
    # same issue twice.
    concurrency:
      group: production-watch
      cancel-in-progress: false
    permissions:
      contents: read
      # Open, comment on and close the production-down issue.
      issues: write
      # Read this workflow's earlier runs ("two failures in a row"), and the
      # keepalive below.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production
        # No npm install: the script uses nothing but Node's own fetch. It
        # exits 1 when a check fails, which is what the next run reads as
        # "the previous check failed".
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_WORKFLOW: production-watch.yml
        run: node scripts/production-watch.mjs

      - name: Keep the schedule alive
        # GitHub turns off a public repository's scheduled workflows after 60
        # days without activity in the repository, silently, and this one is
        # only worth anything while it runs. Enabling the workflow through the
        # API restarts that count; it changes nothing else and is harmless
        # when the workflow is already on. Never fails the run: the run's
        # result has to be the checks' result.
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/production-watch.yml/enable"

  verify-deploy:
    # Production only, and only once Vercel says it is ready. Every preview
    # deployment fires this event too; they are skipped here.
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # verify-deploy decodes a map tile with @mapbox/vector-tile and pbf,
      # which are the web app's dev dependencies.
      - run: npm ci

      - name: Verify the deployment
        # The URL is the deployment's own, passed through the environment and
        # never written into the script, so nothing in an event can become a
        # command. Vercel's own URL for a deployment is behind the team's
        # login; `target` then answers with the production address it was put
        # behind. One retry a minute later, for the seconds in which the
        # address may still point at the previous deployment.
        #
        # No cron secret is sent: this is a public repository's log, and
        # health names missing rules only to the secret.
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          TARGET="$(node scripts/production-watch.mjs target "$DEPLOYMENT_URL")"
          echo "Verifying $TARGET"
          node scripts/verify-deploy.mjs "$TARGET" || {
            echo "Failed once; trying again in 60 seconds."
            sleep 60
            node scripts/verify-deploy.mjs "$TARGET"
          }
