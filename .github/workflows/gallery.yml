name: QA gallery

# The slow half of the QA harness: a screenshot of every page in both locales
# at three widths, plus the two audits that ratchet against a recorded list,
# over every route at both of their widths. ci.yml runs the same two audits on
# every pull request, on the report pages and /map at 390px only.
#
# Not on every push, on purpose. The matrix is about a hundred page loads and
# four minutes of browser time, and a reviewer looks at it when a page is
# rebuilt — not forty times a day. Per-PR checks live in ci.yml and are the ones
# that must stay fast.
#
#   Run it by hand before and after rebuilding a page:
#     gh workflow run gallery.yml
#   then download the `qa-gallery` artifact and open index.html. To compare, put
#   the earlier run beside it and open index.html?before=../<that dir>.

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC is 02:00 in Taipei: the numbers are not production's, but a
    # quiet hour keeps the runner honest about timing.
    - cron: "0 18 * * *"

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

jobs:
  gallery:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create Supabase's API roles
        # As in ci.yml: the database the pages are photographed against has
        # the roles and grants a Supabase project starts with, and the
        # migrations' revokes run against them.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/ci-roles.sql

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "--- $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Load test fixture
        # The same thin slice CI uses. Worth saying plainly: the gallery this
        # produces shows the app's layout, not the country's data. The owner's
        # sign-off gallery is shot against a Vercel preview with TEST_BASE_URL.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed-test.sql

      - name: Build
        # NEXT_PUBLIC_E2E exposes window.__map, which is how the screenshots
        # wait for the map to have painted instead of sleeping fifteen seconds
        # at it. The build therefore differs from production by that one guard.
        env:
          NEXT_PUBLIC_E2E: "1"
        run: npm run build

      - name: Start server
        id: server
        # /api/health rather than /, as in ci.yml: the root is prerendered and
        # answers before the app can serve anything that needs the database.
        # A curl loop rather than wait-on, for the reasons at the top of ci.yml.
        run: |
          npm run start --workspace @conservation/web &
          for i in $(seq 90); do curl -fs -o /dev/null --max-time 5 http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS -o /dev/null --max-time 5 http://localhost:3000/api/health

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Screenshot every page
        run: npm run shots --workspace @conservation/web

      - name: axe over every route, both locales, 390 and 1440
        # Ratchets against e2e/a11y-known.json. It shipped empty, ran here
        # with continue-on-error so a red first run could not stop the
        # contrast step below from recording its own baseline, and has found
        # nothing every night since: the empty file is the baseline. So a
        # finding now turns the run red.
        #
        # Each audit runs whenever the server is up, whatever the step before
        # it did, so a failed screenshot or a red axe step does not hide what
        # the next check would have said.
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: npm run test:a11y --workspace @conservation/web

      - name: WCAG AA contrast on the rendered pages
        # Same, against e2e/contrast-known.json, which is also empty and also
        # clean every night. `dark-tokens-on-light` shipped while the file that
        # would have caught it sat in the tree unrun, which is the whole reason
        # this step exists.
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: npm run test:contrast --workspace @conservation/web

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-gallery
          path: apps/web/e2e/shots/
          if-no-files-found: warn
          retention-days: 30
