<!--
  The mark from components/brand/Mark.tsx, as a standalone file for the browser
  tab, the PWA icon and OG cards.

  Same geometry on the same 64-unit grid, but the palette is written out as
  literal hex rather than Tailwind classes: this file is loaded directly by the
  browser and by other apps' icon pipelines, none of which have the stylesheet.
  Keep the two in step when the mark changes.

  A rounded square rather than a bare circle, because the OS masks it anyway and
  a circle inside a circle crops the rivets off.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0b1410"/>

  <circle cx="32" cy="32" r="28.5" fill="#1a3125"/>
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#d8cbb0" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#d8cbb0" stroke-width="0.9" opacity=".3"/>

  <!-- Three interlocking rows of pointed scales, drawn back to front. -->
  <g stroke="#0f1c16" stroke-width="1.1">
    <path d="M32 10.5 C40.5 15.25, 40.5 24.75, 32 29.5 C23.5 24.75, 23.5 15.25, 32 10.5 Z" fill="#8a6a45"/>
    <path d="M24 20.5 C32.5 25.25, 32.5 34.75, 24 39.5 C15.5 34.75, 15.5 25.25, 24 20.5 Z
             M40 20.5 C48.5 25.25, 48.5 34.75, 40 39.5 C31.5 34.75, 31.5 25.25, 40 20.5 Z" fill="#a8845c"/>
    <path d="M16 30.5 C24.5 35.25, 24.5 44.75, 16 49.5 C7.5 44.75, 7.5 35.25, 16 30.5 Z
             M32 30.5 C40.5 35.25, 40.5 44.75, 32 49.5 C23.5 44.75, 23.5 35.25, 32 30.5 Z
             M48 30.5 C56.5 35.25, 56.5 44.75, 48 49.5 C39.5 44.75, 39.5 35.25, 48 30.5 Z" fill="#c9a882"/>
  </g>

  <!-- The road. -->
  <path d="M14 50.5 h9 M28 50.5 h9 M42 50.5 h8" fill="none" stroke="#d8cbb0"
        stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <circle cx="6" cy="32" r="2.1" fill="#cf7238"/>
  <circle cx="58" cy="32" r="2.1" fill="#cf7238"/>
</svg>
